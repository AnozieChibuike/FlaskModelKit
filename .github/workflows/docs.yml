name: Docs

# Publishes site/ to GitHub Pages: https://anoziechibuike.github.io/FlaskModelKit/
# AGENT.md from the repo root is copied in, so it is served at .../FlaskModelKit/AGENT.md.
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".

on:
  push:
    branches: [ "master" ]
    paths: [ "site/**", "AGENT.md", ".github/workflows/docs.yml" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/configure-pages@v5
    - name: Publish AGENT.md alongside the site
      run: cp AGENT.md site/AGENT.md
    - uses: actions/upload-pages-artifact@v3
      with:
        path: site
    - id: deployment
      uses: actions/deploy-pages@v4
