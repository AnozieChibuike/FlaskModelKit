name: Build & install

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Build sdist and wheel
      run: |
        python -m pip install --upgrade pip build
        python -m build
    - name: Install the built wheel and import it
      run: |
        python -m venv /tmp/check
        /tmp/check/bin/pip install dist/*.whl
        cd /tmp && /tmp/check/bin/python -c "from flasksqlalchemybasemodel import BaseModel, BaseModelMixin, db"
