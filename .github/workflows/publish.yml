name: Publish to PyPI

# Runs when you publish a GitHub release (e.g. tag v1.0.0).
# Uses PyPI Trusted Publishing: no password or API token is stored anywhere.
# One-time setup on pypi.org: Account → Publishing → "Add a new pending publisher"
#   PyPI project name: flask-modelkit
#   Owner: AnozieChibuike   Repository: (this repo's name)
#   Workflow: publish.yml   Environment: pypi

on:
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - run: |
        python -m pip install --upgrade pip
        pip install -e . pytest alembic
        pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Check the release tag matches the package version
      run: |
        version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['tool']['poetry']['version'])")
        if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
          echo "Tag $GITHUB_REF_NAME does not match pyproject version $version"; exit 1
        fi
    - run: |
        python -m pip install --upgrade pip build
        python -m build
    - uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/
    - uses: pypa/gh-action-pypi-publish@release/v1
