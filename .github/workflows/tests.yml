name: Tests

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        deps: ["latest"]
        include:
          # Oldest versions pyproject.toml claims to support
          - python-version: "3.10"
            deps: "minimum"

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install
      run: |
        python -m pip install --upgrade pip
        if [ "${{ matrix.deps }}" = "minimum" ]; then
          pip install "flask==3.0.0" "werkzeug==3.0.*" "flask-sqlalchemy==3.1.1" "sqlalchemy==2.0.16"
        fi
        pip install -e . pytest alembic
    - name: Test
      run: pytest -q
