[tool.poetry]
name = "flask-modelkit"
version = "1.0.0"
description = "Composable model mixins for Flask-SQLAlchemy: UUID keys, UTC timestamps, soft delete, safe writes from request data, hidden and protected fields, and typed CRUD helpers."
authors = ["AnozieChibuike <chibuikeanozie0@gmail.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/AnozieChibuike/FlaskModelKit"
repository = "https://github.com/AnozieChibuike/FlaskModelKit"
documentation = "https://anoziechibuike.github.io/FlaskModelKit/"
keywords = ["flask", "sqlalchemy", "flask-sqlalchemy", "orm", "base model", "mixin", "soft delete", "uuid"]
classifiers = [
    "Framework :: Flask",
    "Topic :: Database",
    "Typing :: Typed",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
packages = [{ include = "flask_modelkit" }]

[tool.poetry.dependencies]
python = "^3.10"
flask = "^3.0.0"
flask-sqlalchemy = "^3.1.1"
sqlalchemy = "^2.0.16"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
alembic = "^1.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"