[tool.poetry]
name = "FlaskSQLAlchemyBaseModel"
version = "2.0.0"
description = "A reusable base model for Flask-SQLAlchemy: UUID primary keys, UTC timestamps, safe updates, cycle-safe serialisation and typed CRUD/query helpers."
authors = ["AnozieChibuike <chibuikeanozie0@gmail.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/AnozieChibuike/FlaskSQLAlchemyBaseModel"
repository = "https://github.com/AnozieChibuike/FlaskSQLAlchemyBaseModel"
keywords = ["flask", "sqlalchemy", "orm", "base model", "mixin"]
classifiers = [
    "Framework :: Flask",
    "Topic :: Database",
    "Typing :: Typed",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
packages = [{ include = "flasksqlalchemybasemodel" }]

[tool.poetry.dependencies]
python = "^3.10"
flask = "^3.0.0"
flask-sqlalchemy = "^3.1.1"
sqlalchemy = "^2.0.16"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
alembic = "^1.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"